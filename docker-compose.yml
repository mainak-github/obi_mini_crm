services:
  postgres:
    image: postgres:16-alpine
    container_name: miui-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: miui_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - miui_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miui_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  miui_crm_data:
